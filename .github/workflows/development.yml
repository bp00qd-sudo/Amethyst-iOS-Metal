name: Amethyst iOS Metal build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build full iOS IPA/TIPA
    runs-on: macos-15
    env:
      # The hosted image currently carries Xcode 26.3.  The setup step below
      # falls back to the image default if Apple changes the installed path.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SLIMMED: "0"
      RUNNER: "0"
      METALUNIVERSAL_REPOSITORY: https://github.com/bp00qd-sudo/MetalUniversal-iOS.git
      METALUNIVERSAL_COMMIT: f25d729701329dc826312747e98ed4c136c84b03

    steps:
      - name: Checkout Amethyst
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode and print toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            unset DEVELOPER_DIR
            echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid make wget
          echo "PATH=$(brew --prefix)/bin:$PATH" >> "$GITHUB_ENV"
          gmake --version | head -1
          ldid -h >/dev/null 2>&1 || true

      - name: Install JDK 25 for MetalUniversal
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      - name: Build and embed pinned MetalUniversal
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/MetalUniversal"
          git clone --filter=blob:none --no-checkout "$METALUNIVERSAL_REPOSITORY" "$source_dir"
          git -C "$source_dir" checkout --detach "$METALUNIVERSAL_COMMIT"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$METALUNIVERSAL_COMMIT"
          chmod +x "$source_dir/gradlew"
          (
            cd "$source_dir"
            ./gradlew buildIOSNative buildIOSSpvc buildIOSShaderc build --no-daemon
          )

          mapfile -t main_jars < <(find "$source_dir/build/libs" -maxdepth 1 -type f \
            -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | sort)
          if [[ "${#main_jars[@]}" -ne 1 ]]; then
            echo "Expected one MetalUniversal main jar, found ${#main_jars[@]}" >&2
            printf '%s\n' "${main_jars[@]}" >&2
            exit 1
          fi

          install -m 0644 "${main_jars[0]}" \
            Natives/resources/bundled_mods/metallum-1.0.1.jar
          install -m 0755 "$source_dir/src/main/resources/natives/ios/libmetallum.dylib" \
            Natives/resources/Frameworks/libmetallum.dylib
          install -m 0755 "$source_dir/src/main/resources/natives/ios/libspvc.dylib" \
            Natives/resources/Frameworks/libspvc.dylib
          install -m 0755 "$source_dir/build/ios-artifacts/libshaderc.dylib" \
            Natives/resources/Frameworks/lwjgl34/libshaderc.dylib

          echo "Embedded MetalUniversal $METALUNIVERSAL_COMMIT"
          shasum -a 256 \
            Natives/resources/bundled_mods/metallum-1.0.1.jar \
            Natives/resources/Frameworks/libmetallum.dylib \
            Natives/resources/Frameworks/libspvc.dylib \
            Natives/resources/Frameworks/lwjgl34/libshaderc.dylib

      - name: Prepare and verify embedded MetalUniversal
        shell: bash
        run: |
          set -euo pipefail
          test -f Natives/resources/bundled_mods/metallum-1.0.1.jar
          test -f Natives/resources/Frameworks/libmetallum.dylib
          test -f Natives/resources/Frameworks/libspvc.dylib
          test -f Natives/resources/Frameworks/lwjgl34/libshaderc.dylib
          shaderc_dylib="Natives/resources/Frameworks/lwjgl34/libshaderc.dylib"
          test "$(xcrun lipo -archs "$shaderc_dylib")" = "arm64"
          test "$(xcrun vtool -show-build "$shaderc_dylib" | awk '$1 == "platform" { print $2 }')" = "IOS"
          test "$(xcrun vtool -show-build "$shaderc_dylib" | awk '$1 == "minos" { print $2 }')" = "14.0"
          test "$(xcrun otool -D "$shaderc_dylib" | awk 'NR > 1 && NF { print $1 }')" = "@rpath/libshaderc.dylib"

          shaderc_class="$(mktemp)"
          required_shaderc_symbols="$(mktemp)"
          exported_shaderc_symbols="$(mktemp)"
          unzip -p JavaApp/libs/lwjgl-3.4.1/lwjgl-shaderc.jar \
            'org/lwjgl/util/shaderc/Shaderc$Functions.class' > "$shaderc_class"
          LC_ALL=C perl -0777 -ne 'while (/(shaderc_[A-Za-z0-9_]+)/g) { print "$1\n" }' \
            "$shaderc_class" | sort -u > "$required_shaderc_symbols"
          xcrun nm -gU "$shaderc_dylib" | awk '{ print $NF }' | sed 's/^_//' | \
            grep '^shaderc_' | sort -u > "$exported_shaderc_symbols"
          test "$(wc -l < "$required_shaderc_symbols" | tr -d ' ')" = "45"
          missing_shaderc_symbols="$(comm -23 "$required_shaderc_symbols" "$exported_shaderc_symbols")"
          if [[ -n "$missing_shaderc_symbols" ]]; then
            echo "libshaderc.dylib is missing LWJGL 3.4.1 symbols:" >&2
            echo "$missing_shaderc_symbols" >&2
            exit 1
          fi
          grep -Fxq shaderc_compile_options_set_max_id_bound "$exported_shaderc_symbols"
          metal_dependencies="$(xcrun otool -L Natives/resources/Frameworks/libmetallum.dylib)"
          grep -Fq '/System/Library/Frameworks/MetalFX.framework/MetalFX' <<< "$metal_dependencies"
          metal_strings="$(strings Natives/resources/Frameworks/libmetallum.dylib)"
          grep -Fq 'METALLUM_METALFX_ENABLED' <<< "$metal_strings"
          rm -f "$shaderc_class" "$required_shaderc_symbols" "$exported_shaderc_symbols"
          # PR #245's prebuilt iOS natives use build-directory install names.
          # Normalize them to @rpath before Amethyst's payload signing pass.
          for dir in Natives/resources/Frameworks/lwjgl33 Natives/resources/Frameworks/lwjgl34; do
            for file in "$dir"/*.dylib; do
              [[ -f "$file" ]] || continue
              install_name_tool -id "@rpath/$(basename "$file")" "$file" || true
            done
          done
          chmod 755 Natives/resources/Frameworks/*.dylib Natives/resources/Frameworks/lwjgl33/*.dylib Natives/resources/Frameworks/lwjgl34/*.dylib

      - name: Install JDK 8 for launcher build
        uses: actions/setup-java@v4
        with:
          # Temurin stopped publishing a macOS Java 8 package to the hosted
          # runner's toolcache.  Zulu still provides the Java 8 runtime needed
          # by JavaApp's source/target-8 launcher build.
          distribution: zulu
          java-version: '8'

      - name: Build complete IPA and TrollStore TIPA
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix)/bin:$PATH"
          export BOOTJDK="$JAVA_HOME/bin"
          export SLIMMED=0
          export RUNNER=0
          export RELEASE=1
          jobs="$(sysctl -n hw.logicalcpu)"
          # Keep dsym and package in one serial make invocation.  Both goals
          # share Payload; -j1 prevents dsymutil from racing the signing/zip
          # recipe, while the Makefile's CMake/Java sub-builds still use the
          # detected CPU count internally.
          gmake -j1 BOOTJDK="$BOOTJDK" JOBS="$jobs" RELEASE=1 SLIMMED=0 RUNNER=0 dsym package PLATFORM=2

          # Re-sign the already-built Payload executable with TrollStore
          # entitlements and make the TIPA without rebuilding all native/JRE
          # inputs a second time.
          app="artifacts/Payload/AngelAuraAmethyst.app"
          ldid -S "$app"
          ldid -S"$PWD/entitlements.trollstore.xml" "$app/AngelAuraAmethyst"
          (cd artifacts && zip --symlinks -r org.angelauramc.amethyst-1.0-ios-trollstore.tipa Payload)

      - name: Validate IPA contents
        shell: bash
        run: |
          set -euo pipefail
          ipa="$(find artifacts -maxdepth 1 -type f -name 'org.angelauramc.amethyst-*-ios.ipa' | head -1)"
          tipa="$(find artifacts -maxdepth 1 -type f -name 'org.angelauramc.amethyst-*-ios-trollstore.tipa' | head -1)"
          [[ -n "$ipa" && -f "$ipa" ]]
          [[ -n "$tipa" && -f "$tipa" ]]
          for package in "$ipa" "$tipa"; do
            echo "Checking $package"
            unzip -l "$package" | grep -E 'Frameworks/libmetallum\.dylib|Frameworks/libspvc\.dylib|Frameworks/lwjgl34/libshaderc\.dylib|bundled_mods/metallum-1\.0\.1\.jar|libs/lwjgl-3\.4\.1/lwjgl-3\.4\.1\.jar|java_runtimes/java-25-openjdk/release'
            jar_entry="$(unzip -Z1 "$package" | grep '/libs/lwjgl-3\.4\.1/lwjgl-3\.4\.1\.jar$' | head -1)"
            [[ -n "$jar_entry" ]]
            jar_tmp="$(mktemp)"
            trap 'rm -f "$jar_tmp"' EXIT
            unzip -p "$package" "$jar_entry" > "$jar_tmp"
            unzip -l "$jar_tmp" | grep -q 'org/lwjgl/util/spvc/Spvc.class'
            rm -f "$jar_tmp"
            trap - EXIT
          done

      - name: Upload full IPA
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-metal-ios-ipa
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload TrollStore TIPA
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-metal-ios-tipa
          path: artifacts/org.angelauramc.amethyst-*-ios-trollstore.tipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-metal-ios-dsym
          path: artifacts/AngelAuraAmethyst.dSYM
          if-no-files-found: warn
          retention-days: 30
